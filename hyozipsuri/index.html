<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3D2A1C" />
    <title>효성집수리 · 최효성</title>
    <meta name="description" content="목공과 전기를 한 번에 시공하는 효성집수리. 용인, 수원, 동탄." />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="css/site.css" />
  </head>
  <body>
    <a class="skip" href="#main">본문으로 건너뛰기</a>
    <header class="topbar">
      <a class="brand" href="#top" id="brandName">효성집수리</a>
    </header>

    <main id="main">
      <section class="card-stage" id="top">
        <article class="biz-card">
          <p class="biz-headline" id="cardHeadline"></p>
          <div class="biz-head">
            <img class="biz-logo" src="images/character.jpg" alt="" />
            <div>
              <p class="biz-company" id="cardCompany">효성집수리</p>
              <p class="biz-tag" id="cardTagline">전기 · 목공 인테리어</p>
            </div>
          </div>

          <div class="biz-person">
            <img class="biz-photo" id="cardPhoto" src="images/character-face.jpg" alt="최효성" />
            <div>
              <h1 id="cardName">최효성</h1>
              <p class="biz-role" id="cardTitle">대표</p>
              <p class="biz-phone" id="cardPhone">010-8204-0998</p>
              <p class="biz-area" id="cardArea">용인 · 수원 · 동탄</p>
            </div>
          </div>

          <p class="biz-intro" id="cardIntro"></p>

          <div class="biz-actions">
            <a class="btn primary" id="callBtn" href="tel:">전화하기</a>
            <a class="btn ghost dark" id="smsBtn" href="sms:">문자하기</a>
          </div>
        </article>
      </section>

      <section class="block" id="notice">
        <div id="noticeList" class="notice-list"></div>
      </section>

      <section class="block works-show" id="works" hidden>
        <p class="works-label">시공 사진</p>
        <div id="worksStage"></div>
      </section>

      <section class="block blog-cta" id="blog">
        <p class="blog-ask" id="blogCta">더 많은 시공 사진이 보고 싶다면?</p>
        <div class="blog-links">
          <a class="btn primary full" id="blogBtn" href="https://m.blog.naver.com/tmfhomerepair" target="_blank" rel="noopener">
            <span class="blog-ico naver" aria-hidden="true">N</span>
            네이버 블로그
          </a>
          <a class="btn ghost dark full" id="wpBlogBtn" href="https://hsmwk.kr/" target="_blank" rel="noopener">
            <span class="blog-ico wp" aria-hidden="true">W</span>
            워드프레스블로그
          </a>
        </div>
      </section>
    </main>

    <footer class="foot">
      <a class="admin-link" id="adminLink" href="admin.html">관리자</a>
    </footer>

    <script src="js/rich-text.js"></script>
    <script src="js/visit-stats.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
